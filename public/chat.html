<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SupportBot — TechStore</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f0f2f5;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .chat-container {
      width: 420px;
      height: 600px;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.12);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .chat-header {
      background: #1a73e8;
      color: #fff;
      padding: 16px 20px;
      font-size: 16px;
      font-weight: 600;
      flex-shrink: 0;
    }

    .chat-header span {
      font-size: 12px;
      font-weight: 400;
      opacity: 0.8;
      display: block;
    }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .msg {
      max-width: 80%;
      padding: 10px 14px;
      border-radius: 16px;
      font-size: 14px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .msg.bot {
      background: #f0f2f5;
      color: #1c1e21;
      align-self: flex-start;
      border-bottom-left-radius: 4px;
    }

    .msg.user {
      background: #1a73e8;
      color: #fff;
      align-self: flex-end;
      border-bottom-right-radius: 4px;
    }

    .msg.erro {
      background: #fdecea;
      color: #c62828;
      align-self: flex-start;
      border-bottom-left-radius: 4px;
    }

    .msg.digitando {
      background: #f0f2f5;
      color: #888;
      align-self: flex-start;
      border-bottom-left-radius: 4px;
      padding: 12px 16px;
    }

    .digitando-dots {
      display: flex;
      gap: 4px;
      align-items: center;
    }

    .digitando-dots span {
      width: 7px;
      height: 7px;
      background: #aaa;
      border-radius: 50%;
      display: inline-block;
      animation: blink 1.2s infinite;
      opacity: 0.3;
    }

    .digitando-dots span:nth-child(2) { animation-delay: 0.2s; }
    .digitando-dots span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes blink {
      0%, 80%, 100% { opacity: 0.3; }
      40% { opacity: 1; }
    }

    .chat-input {
      display: flex;
      padding: 12px 16px;
      border-top: 1px solid #e4e6eb;
      gap: 8px;
      align-items: center;
      flex-shrink: 0;
    }

    .chat-input input {
      flex: 1;
      padding: 10px 14px;
      border: 1px solid #ddd;
      border-radius: 24px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }

    .chat-input input:focus { border-color: #1a73e8; }

    .chat-input button {
      background: #1a73e8;
      color: #fff;
      border: none;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      cursor: pointer;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background 0.2s;
    }

    .chat-input button:hover { background: #1558b0; }
    .chat-input button:disabled { background: #ccc; cursor: default; }
  </style>
</head>
<body>
  <div class="chat-container">
    <div class="chat-header">
      SupportBot
      <span>TechStore — Atendimento ao Cliente</span>
    </div>
    <div class="chat-messages" id="messages"></div>
    <div class="chat-input">
      <input id="input" type="text" placeholder="Digite sua mensagem..." disabled />
      <button id="btn" onclick="enviar()" disabled>➤</button>
    </div>
  </div>

  <script>
    const messages = document.getElementById('messages');
    const input = document.getElementById('input');
    const btn = document.getElementById('btn');
    let digitando_el = null;

    const ws = new WebSocket(`ws://${location.host}/ws/chat`);

    ws.onopen = () => {
      input.disabled = false;
      btn.disabled = false;
      input.focus();
    };

    ws.onmessage = (e) => {
      const evento = JSON.parse(e.data);
      if (evento.tipo === 'session_started') return;

      if (evento.tipo === 'digitando') {
        if (!digitando_el) {
          digitando_el = document.createElement('div');
          digitando_el.className = 'msg digitando';
          digitando_el.innerHTML = '<div class="digitando-dots"><span></span><span></span><span></span></div>';
          messages.appendChild(digitando_el);
          messages.scrollTop = messages.scrollHeight;
        }
        return;
      }

      if (digitando_el) {
        digitando_el.remove();
        digitando_el = null;
      }

      const classe = evento.tipo === 'erro' ? 'erro' : 'bot';
      adicionar_msg(evento.texto || evento.mensagem, classe);
    };

    ws.onclose = () => {
      adicionar_msg('Conexão encerrada.', 'erro');
      input.disabled = true;
      btn.disabled = true;
    };

    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') enviar();
    });

    function enviar() {
      const texto = input.value.trim();
      if (!texto) return;
      adicionar_msg(texto, 'user');
      ws.send(texto);
      input.value = '';
    }

    function adicionar_msg(texto, classe) {
      const div = document.createElement('div');
      div.className = `msg ${classe}`;
      div.textContent = texto;
      messages.appendChild(div);
      messages.scrollTop = messages.scrollHeight;
    }
  </script>
</body>
</html>
